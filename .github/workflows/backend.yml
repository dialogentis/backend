name: Backend checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
          python-version: '3.14.6'
      - run: uv sync --locked
      - run: make check test
      - run: uv run --locked python scripts/init_env.py
      - run: make integration
      - if: always()
        run: docker compose -p dialogentis-test -f compose.yaml -f compose.test.yaml --profile test down -v
