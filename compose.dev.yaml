services:
  api:
    command: [uv, run, --locked, --no-dev, --no-sync, uvicorn, 'dialogentis.main:app', --host, 0.0.0.0, --port, '8000', --reload, --no-access-log]
    volumes: ['./src:/app/src:ro', 'artifacts:/app/artifacts']
  frontend:
    image: dialogentis-frontend-dev:0.1.0
    build:
      context: ../frontend
      target: development
    ports: !override ['127.0.0.1:5180:5178']
    environment: {API_PROXY_TARGET: 'http://api:8000'}
    volumes: ['../frontend/src:/app/src:ro', '../frontend/public:/app/public:ro']
