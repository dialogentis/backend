[project]
name = "atlas-backend"
version = "0.1.0"
description = "Веб-сервер конструктора диалоговых агентов"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyyaml>=6,<7",
    "regex>=2024.11",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "ruff>=0.12,<1",
    "ty>=0.0.1,<1",
    "types-pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py314"

[tool.ty.src]
exclude = ["app/rasa_parse.py"]
