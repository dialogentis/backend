services:
  frontend:
    ports: !override ['127.0.0.1:18180:8080']
  api:
    ports: !override ['127.0.0.1:18100:8000']
    environment:
      LLM_BASE_URL: http://llm-fixture:8000/v1
      LLM_MODEL: fixture
      LLM_API_KEY: ""
    depends_on:
      llm-fixture: {condition: service_started}
  mailpit:
    ports: !override ['127.0.0.1:18125:8025']
  llm-fixture:
    build:
      context: .
      target: test
    command: [uv, run, --locked, --no-sync, python, -m, tests.llm_fixture_server]
    networks: [internal]
